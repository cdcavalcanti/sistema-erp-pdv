name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm typecheck
      - name: Testes (venda, pagamentos, caixa, offline, fiscal, hardware, configuração; aceite do MVP só com o vortex-erp)
        run: pnpm test
      - name: Pacote do terminal (agente + frente de caixa)
        run: infra/release.sh ci
      - name: Auditoria de dependências
        run: pnpm audit --prod --audit-level high
